# .github/workflows/ci.yml
# Intégration continue (CI) : à chaque push sur main et à chaque pull request,
# GitHub installe le projet sur une machine neuve et lance TOUTES nos
# vérifications. Résultat : une coche verte ou une croix rouge sur le commit.
# Doc : https://docs.github.com/actions

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Droits minimaux : la CI lit le code, elle ne peut rien modifier sur le dépôt.
permissions:
  contents: read

# Si tu pousses deux fois de suite, la vérification du commit précédent est
# annulée : seule la dernière version compte.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifications:
    name: Vérifications
    # Version d'Ubuntu fixée (plutôt que "latest") : même machine à chaque fois.
    runs-on: ubuntu-24.04
    # Garde-fou : un job bloqué est arrêté au bout de 20 minutes.
    timeout-minutes: 20

    steps:
      # Les actions sont fixées par leur empreinte de commit (SHA), pas par leur
      # étiquette (v7) : une étiquette peut être déplacée, une empreinte non.
      # C'est la recommandation de sécurité de GitHub pour les actions tierces.
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ne garde pas le jeton GitHub sur le disque après la récupération :
          # aucune étape suivante n'en a besoin.
          persist-credentials: false

      - name: Installer Node.js (version lue dans .node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # Met en cache les paquets téléchargés (clé = package-lock.json).
          cache:
            npm

            # npm ci : installe EXACTEMENT le lockfile, et échoue s'il n'est pas
      # cohérent avec package.json. npm est celui fourni avec Node (.node-version),
      # exactement comme sur Cloudflare.
      - name: Installer les dépendances
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Types (TypeScript)
        run: npm run typecheck

      - name: Formatage (Prettier)
        run: npm run format:check

      - name: Tests unitaires (Vitest)
        run: npm test

      # Chromium + les bibliothèques système dont il a besoin sous Linux.
      - name: Installer le navigateur de Playwright
        run: npx playwright install --with-deps chromium

      # Construit le site (variables de test de playwright.config.ts) puis le teste.
      # GitHub définit CI=true : 1 relance en cas d'échec, test.only interdit.
      - name: Tests de bout en bout (Playwright)
        run: npm run test:e2e

      # En cas d'échec seulement : captures et traces téléchargeables depuis la
      # page du run sur GitHub (section "Artifacts"), gardées 7 jours.
      - name: Conserver les traces des tests en échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traces-playwright
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
